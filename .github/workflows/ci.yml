name: Go Makefile CI

on:
  push:
    branches: [dev]
  pull_request:
      branches:
        [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.5'

      - name: Run make run(builds and runs)
        run: make run

      - name: Runs test cases
        run: make test


